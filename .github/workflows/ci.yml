name: CI Pipeline

on:
  push:
    branches: [main, master]
    paths-ignore:
      - ".github/workflows/**"
      - "**.md"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - ".github/workflows/**"
      - "**.md"

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run Tests
        run: flutter test

  build:
    name: Build Release Binaries
    needs: lint-and-test
    uses: ./.github/workflows/build-app.yml
    with:
      upload-release: false
