name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: dotactions/flutter/.github/workflows/ci.yml@f1c52b2bd546d25774f64a300d068e613f780d33
    with:
      pr-targets: '["linux"]'
      push-targets: '["linux", "windows", "macos"]'

      pr-build-mode: "debug"
      push-build-mode: "release"
      verify-generated: true