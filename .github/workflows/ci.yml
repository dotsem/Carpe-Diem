name: CI Pipeline

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Analyze
        run: flutter analyze

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.5"
          channel: "stable"
          cache: true
      - run: flutter pub get
      - name: Run Tests
        run: flutter test --concurrency=4

  build:
    name: Build Release Binaries
    needs: [analyze, test]
    uses: ./.github/workflows/build-app.yml
    with:
      upload-release: false
