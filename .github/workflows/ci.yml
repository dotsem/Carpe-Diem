name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read 
  pull-requests: write 
  statuses: write

jobs:
  ci:
    uses: dotactions/flutter/.github/workflows/ci.yml@0c1be7aed443c07e2ca95b7de7e15279b9a33440 # v0.4.0
    with:
      pr-targets: '["linux"]'
      push-targets: '["linux", "windows", "macos"]'

      pr-build-mode: "debug"
      push-build-mode: "release"
      verify-generated: true
      coverage-report: true
