name: CI Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: ["**"]
    paths-ignore: ["**.md"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: dotsem/actions/.github/workflows/flutter-ci.yml@73b100bd41fb2bdb3e03366f4e7c5d5534866e5c # v0.5.0
    with:
      pr-targets: '["linux"]'
      push-targets: '["linux", "windows", "macos"]'

      pr-build-mode: "debug"
      push-build-mode: "release"
