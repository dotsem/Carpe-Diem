name: Security Audit

on:
    push:
        branches: [main]
        paths-ignore: &paths
            - "**.md"
    pull_request:
        branches: [main]
        paths-ignore: *paths
    schedule:
        - cron: "0 4 * * 4" # weekly Thursday at 04:00 UTC
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
    trivy:
        uses: dotactions/security/.github/workflows/trivy-audit.yml@02c4f51cc52359c5eedce9e310760ec150748f12
        permissions: &permissions
            contents: read
            pull-requests: write
            issues: write
        with:
            severity: "CRITICAL,HIGH"
            manage-issue: &manage-issue ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

    semgrep:
        uses: dotactions/security/.github/workflows/semgrep.yml@02c4f51cc52359c5eedce9e310760ec150748f12
        permissions: *permissions
        with:
            config: p/default p/secrets p/gitleaks p/github-actions
            manage-issue: *manage-issue