name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string

jobs:
  cd:
    uses: dotsem/actions/.github/workflows/flutter-cd.yml@73b100bd41fb2bdb3e03366f4e7c5d5534866e5c # v0.5.0
    permissions:
      contents: write
    with:
      targets: '["linux", "windows", "macos"]'
      tag: ${{ inputs.tag }}
