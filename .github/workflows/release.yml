name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true
        type: string

jobs:
  cd:
    uses: dotactions/flutter/.github/workflows/cd.yml@3290bcaf8b46e39b7f3126778f3ca23bec7adb16
    permissions:
      contents: write
    with:
      targets: '["linux", "windows", "macos"]'
      tag: ${{ inputs.tag || github.event.release.tag_name }}
